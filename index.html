<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#f7f6f2;color:#151515;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overscroll-behavior-x:none}
main{width:min(980px,100%);margin:0 auto;padding:22px 14px 32px}
.pageTitle{display:flex;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:25px;line-height:1.1;margin:0;font-weight:900;letter-spacing:-.05em;text-transform:uppercase}
.card{background:#fff;border:1px solid #e6e2da;border-radius:22px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.035);margin-bottom:12px}
.stage{width:min(78%,720px);margin:0 auto;aspect-ratio:1/1;min-height:0;background:#f4f1e9;border-radius:17px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.poster{width:100%;height:100%;padding:8% 7%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.poster-meta{font:700 10px/1.2 "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:5%}
.mixed-line{display:block;width:100%;line-height:.92;word-break:normal;white-space:pre-wrap;text-align:center}
.seg{display:inline-block;white-space:pre-wrap;transform-origin:center bottom;transition:filter .15s,opacity .15s,transform .15s;cursor:pointer}
.seg:hover,.seg.active{filter:invert(1);opacity:.88}
.poster-foot{display:none}
.poster-foot small{font:700 9px/1.3 "DM Mono",monospace;letter-spacing:.08em}
.empty{color:#777;text-align:center;font-size:14px;padding:20px}
.upload{display:flex;align-items:center;justify-content:center;min-height:64px;border:1px dashed #cfcac0;border-radius:16px;cursor:pointer;font-size:16px;font-weight:700;margin-bottom:12px}
.upload input{display:none}
textarea{width:100%;min-height:110px;border:1px solid #ddd8d0;border-radius:15px;background:#fff;padding:14px;font:600 17px/1.5 Pretendard,sans-serif;resize:vertical;outline:none}
textarea:focus,select:focus,input:focus{border-color:#111}
.color-control{margin-top:10px}
input[type=color]{display:block;width:100%;height:48px;margin-top:6px;padding:4px;border:1px solid #ddd8d0;border-radius:13px;background:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
label{display:block;font-size:13px;color:#777;line-height:1.4}
label.full{grid-column:1/-1}
select,input[type=range]{width:100%;margin-top:6px}
select{height:48px;border:1px solid #ddd8d0;border-radius:13px;background:#fff;padding:0 12px;font-size:16px;color:#181818}
input[type=range]{accent-color:#111}
.val{float:right;color:#111;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button.action{height:46px;border:1px solid #ddd8d0;border-radius:14px;background:#fff;font-size:15px;font-weight:500}
#random{grid-column:1/-1}
button.primary{background:#111;color:#fff;border-color:#111}
button:active{transform:scale(.99)}
.font-list{margin-top:12px;border-top:1px solid #ece8e0;padding-top:12px}
.font-list-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:850;font-size:14px}
.font-items{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.font-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e5e0d7;border-radius:11px;background:#fff;min-width:0;cursor:pointer}
.font-item.active{border-color:#111;background:#111;color:#fff}
.font-num{width:22px;height:22px;border-radius:50%;background:#eee;display:grid;place-items:center;flex:none;font:700 10px "DM Mono",monospace}
.font-item.active .font-num{background:#fff;color:#111}
.font-info{min-width:0}
.font-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-script{font-size:10px;opacity:.6;margin-top:1px}
.note{font-size:12px;color:#888;line-height:1.5;margin-top:9px}
@media(max-width:720px){
 main{padding:22px 10px 24px}
 .stage{width:88%}
 h1{font-size:23px}
 .stage{min-height:0}
 .grid{grid-template-columns:1fr 1fr}
 .actions{grid-template-columns:1fr 1fr}
 .font-items{grid-template-columns:1fr}
}

/* Compact 1:1 poster area */
.stage{width:min(92%,720px);aspect-ratio:1/1;height:auto;margin:0 auto}
#poster{width:100%;height:100%;aspect-ratio:1/1;min-height:0;padding:8% 2.5%;box-sizing:border-box}
.mixed-line{margin:0}
button{border-width:1px;font-weight:500}
#reset{color:#1683ff}
@media(max-width:720px){.stage{width:92%;aspect-ratio:1/1}#poster{padding:8% 2%}}
</style>

<main>
  <div class="pageTitle">
    <h1>MIXED TYPE</h1>
  </div>

  <section class="card">
    <div class="stage" id="stage">
      <div class="empty" id="empty"></div>
      <div class="poster" id="poster" hidden></div>
    </div>
  </section>

  <section class="card">
    <label class="full">문구
      <textarea id="text" placeholder="예: STRANGE WORLD / 이상한 세계 / 不思議な世界 / 奇怪的世界">STRANGE WORLD</textarea>
    </label>
    <label class="color-control">텍스트 색상
      <input id="textColor" type="color" value="#111111">
    </label>

    <div class="grid">
      <label>사용 폰트 수 <span class="val" id="fontCountVal">3개</span>
        <input id="fontCount" type="range" min="2" max="12" value="3">
      </label>
      <label>분할 방식
        <select id="split">
          <option value="mixed">문자 혼합</option>
          <option value="word">단어 중심</option>
          <option value="balanced" selected>균형 혼합</option>
        </select>
      </label>
      <label>랜덤 변형 <span class="val" id="variationVal">0%</span>
        <input id="variation" type="range" min="0" max="100" value="0">
      </label>
      <label>글자 크기 <span class="val" id="sizeVal">100%</span>
        <input id="size" type="range" min="70" max="135" value="100">
      </label>
    </div>

    <div class="actions">
      <button class="action" id="random">폰트 다시 섞기</button>
      <button class="action" id="reset">초기화</button>
      <button class="action primary" id="save">PNG 저장</button>
    </div>

    <div class="font-list">
      <div class="font-list-title">
        <span>사용된 폰트 / 적용된 부분</span>
        <span id="segmentCount">0개</span>
      </div>
      <div class="font-items" id="fontItems"></div>
      
    </div>
  </section>
</main>

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function detectScript(ch){
 return /[a-zA-Z0-9]/.test(ch)?'latin':'other';
}
function fontSupports(f,s){return f.scripts.includes('latin');}

function fontFamilyGroup(f){
 const g=f.group||'';
 // 이름이 달라도 시각적으로 같은 계열은 같은 그룹으로 취급한다.
 if(/^serif|slab|^trendy-serif|^classic-display|^serif-/.test(g)) return 'serif';
 if(/^sans|grotesk|modern|fashion-sans|angular|sci-fi|retro-geometric/.test(g)) return 'sans';
 if(/condensed|narrow/.test(g)) return 'condensed';
 if(/^script|handwriting|marker/.test(g)) return 'script';
 if(/mono|typewriter/.test(g)) return 'mono';
 if(/cute|round|rounded/.test(g)) return 'rounded';
 if(/pixel|silkscreen|digital/.test(g)) return 'pixel';
 if(/display|poster|shade|neon|decorative|black|bungee|slab/.test(g)) return 'display';
 return g;
}

function pickFonts(count,rnd){
 const pool=[...FONTS],picked=[],usedFamilies=new Set();

 // 큰 계열은 중복하지 않는다. 단, 필기체는 종류가 워낙 많으므로
 // 한 번의 조합에서 필기체가 여러 개 들어가지는 않도록 한다.
 while(picked.length<count&&pool.length){
   let candidates=pool.filter(f=>!usedFamilies.has(fontFamilyGroup(f)));
   if(!candidates.length)break;

   // 첫 번째 폰트는 전체 풀에서, 이후에는 다른 계열을 우선한다.
   const f=candidates[Math.floor(rnd()*candidates.length)];
   picked.push(f);
   usedFamilies.add(fontFamilyGroup(f));
   pool.splice(pool.indexOf(f),1);
 }
 return picked;
}
function tokenize(text,mode,rnd){
 const chars=Array.from(text),out=[];
 if(mode==='word'){
   let buf='';
   for(const ch of chars){
     buf+=ch;
     if(/\s/.test(ch)||/[，。！？,.!?/]/.test(ch)){out.push(buf);buf='';}
   }
   if(buf)out.push(buf);
   return out;
 }
 let i=0;
 while(i<chars.length){
   if(/\s/.test(chars[i])){out.push(chars[i]);i++;continue;}
   const len=mode==='balanced'?2+Math.floor(rnd()*4):1+Math.floor(rnd()*5);
   let part=chars.slice(i,i+len).join('');
   while(i+len<chars.length&&/[,.!?。！？、]/.test(chars[i+len]))part+=chars[i+len++];
   out.push(part);i+=len;
 }
 return out;
}

function fontForSegment(seg,picked,rnd){
 const chars=Array.from(seg).filter(ch=>!/\s/.test(ch));
 if(!chars.length)return picked[0];
 const script=detectScript(chars[0]);
 const candidates=picked.filter(f=>fontSupports(f,script));
 return (candidates.length?candidates:picked)[Math.floor(rnd()*(candidates.length?candidates.length:picked.length))];
}

function render(){
 const text=textEl.value;
 if(!text.trim()){poster.hidden=true;empty.hidden=false;return}
 poster.hidden=false;empty.hidden=true;

 const rnd=mulberry32(seed);
 const count=+$('fontCount').value;
 const variation=+$('variation').value/100;
 let parts=tokenize(text,$('split').value,rnd);
 const contentCount=Array.from(text).filter(ch=>!/\s/.test(ch)).length;
 const usableCount=Math.min(count,contentCount);
 currentFonts=pickFonts(usableCount,rnd);
 if(usableCount<count){
   $('fontCount').value=usableCount;
 }
 // 선택한 폰트 수보다 실제 글자 조각이 적으면 문자 단위로 분해해서
 // 선택한 폰트가 모두 결과물에 최소 한 번씩 사용되도록 한다.
 const partContentCount=parts.filter(part=>part.trim()).length;
 if(partContentCount<usableCount){
   parts=Array.from(text);
 }
 segments=[];

 // 공백만 있는 조각은 폰트를 배정하지 않고, 실제 글자 조각에는
 // 선택된 폰트를 최소 한 번씩 순환 배정한다.
 const contentIndexes=parts.map((part,i)=>part.trim()?i:-1).filter(i=>i>=0);
 const shuffledFonts=[...currentFonts];
 for(let i=shuffledFonts.length-1;i>0;i--){
   const j=Math.floor(rnd()*(i+1));
   [shuffledFonts[i],shuffledFonts[j]]=[shuffledFonts[j],shuffledFonts[i]];
 }

 parts.forEach((part,index)=>{
   let font;
   if(!part.trim()){
     font=currentFonts[0];
   }else{
     // 먼저 모든 선택 폰트를 한 번씩 사용하고, 그 다음부터 랜덤.
     const position=contentIndexes.indexOf(index);
     font=position<shuffledFonts.length
       ? shuffledFonts[position]
       : shuffledFonts[Math.floor(rnd()*shuffledFonts.length)];
   }
   const base=+$('size').value/100;
   const size=42*base*(1+(rnd()-.5)*.10*variation);
   const rotate=variation===0?0:(rnd()-.5)*12*variation;
   const weight=variation===0?font.weight:font.weight+(rnd()>.55&&font.weight<900?100:0);
   const italic=variation===0?'normal':(rnd()<.14*variation?'italic':'normal');
   const letter=variation===0?0:(rnd()-.5)*.08*variation;
   segments.push({text:part,font,size,rotate,weight,italic,letter,index});
 });

 poster.innerHTML='';
 const line=document.createElement('div');
 line.className='mixed-line';

 segments.forEach(seg=>{
   const el=document.createElement('span');
   el.className='seg';
   el.dataset.index=seg.index;
   el.textContent=seg.text;
   el.style.fontFamily='"'+seg.font.family+'",Pretendard,sans-serif';
   el.style.color=$('textColor').value;
   el.style.fontSize=seg.size+'px';
   el.style.fontWeight=seg.weight;
   el.style.fontStyle=seg.italic;
   el.style.letterSpacing=seg.letter+'em';
   el.style.transform='rotate('+seg.rotate+'deg)';
   el.addEventListener('click',()=>highlight(seg.index));
   line.appendChild(el);
 });
 poster.appendChild(line);
 updateFontList();
}
function highlight(index){
 document.querySelectorAll('.seg').forEach(e=>e.classList.toggle('active',+e.dataset.index===index));
 document.querySelectorAll('.font-item').forEach(e=>e.classList.remove('active'));
 const seg=segments[index];if(!seg)return;
 const item=document.querySelector('[data-font="'+CSS.escape(seg.font.name)+'"]');
 if(item)item.classList.add('active');
}

function updateFontList(){
 const box=$('fontItems');box.innerHTML='';
 const used=new Map();
 segments.forEach(s=>{
   if(!s.text.trim())return;
   if(!used.has(s.font.name))used.set(s.font.name,[]);
   used.get(s.font.name).push(s.text);
 });
 let n=0;
 currentFonts.forEach(font=>{
   const list=used.get(font.name);
   if(!list)return;
   n++;
   const item=document.createElement('div');
   item.className='font-item';
   item.dataset.font=font.name;
   item.style.fontFamily='"'+font.family+'",sans-serif';
   const examples=list.slice(0,4).join(' · ');
   item.innerHTML='<span class="font-num">'+String(n).padStart(2,'0')+'</span><div class="font-info"><div class="font-name">'+font.name+'</div><div class="font-script">'+font.kind+' · '+examples+'</div></div>';
   item.addEventListener('click',()=>{
     document.querySelectorAll('.font-item').forEach(e=>e.classList.remove('active'));
     item.classList.add('active');
     document.querySelectorAll('.seg').forEach(e=>e.classList.toggle('active',segments[+e.dataset.index].font.name===font.name));
   });
   box.appendChild(item);
 });
 $('segmentCount').textContent=segments.filter(s=>s.text.trim()).length+'개 조각';
}

function labels(){
 $('fontCountVal').textContent=$('fontCount').value+'개';
 $('variationVal').textContent=$('variation').value+'%';
 $('sizeVal').textContent=$('size').value+'%';
}

async function savePNG(){
 if(!segments.length)return;
 const btn=$('save');btn.disabled=true;btn.textContent='저장 중…';
 try{
  await document.fonts.ready;
  const posterRect=poster.getBoundingClientRect();
  const scale=4;
  const c=document.createElement('canvas');
  c.width=Math.round(posterRect.width*scale);
  c.height=Math.round(posterRect.height*scale);
  const x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  segments.forEach(seg=>{
    const el=poster.querySelector('[data-index="'+seg.index+'"]');
    if(!el)return;
    const r=el.getBoundingClientRect();
    const cs=getComputedStyle(el);
    const centerX=(r.left+r.width/2-posterRect.left)*scale;
    const baselineY=(r.top+r.height*.78-posterRect.top)*scale;
    x.save();
    x.translate(centerX,baselineY);
    x.rotate(seg.rotate*Math.PI/180);
    x.font=cs.fontStyle+' '+cs.fontWeight+' '+(parseFloat(cs.fontSize)*scale)+'px "'+seg.font.family+'",sans-serif';
    x.fillStyle=cs.color;
    x.textAlign='center';
    x.textBaseline='alphabetic';
    x.fillText(seg.text,0,0);
    x.restore();
  });
  const a=document.createElement('a');
  a.download='mixed-type.png';
  a.href=c.toDataURL('image/png');
  a.click();
 }catch(e){
  console.warn('PNG export failed',e);
  alert('PNG 저장에 실패했어요. 잠시 후 다시 시도해 주세요.');
 }finally{
  btn.disabled=false;btn.textContent='PNG 저장';
 }
}
$('text').addEventListener('input',()=>{seed=Date.now();render()});
$('textColor').addEventListener('input',render);
['fontCount','split','variation','size'].forEach(id=>{
 $(id).addEventListener('input',()=>{labels();render()});
 $(id).addEventListener('change',()=>{labels();render()});
});
$('random').addEventListener('click',()=>{
 seed=Date.now()+Math.floor(Math.random()*1000000);
 render();
});
$('reset').addEventListener('click',()=>{
 textEl.value='STRANGE WORLD';
 $('fontCount').value=3;
 $('split').value='balanced';
 $('variation').value=0;
 $('size').value=100;
 seed=Date.now();
 labels();render();
});
$('save').addEventListener('click',savePNG);
labels();render();
